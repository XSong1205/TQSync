<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#f5f5f7" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="format-detection" content="telephone=no">
  <title>TQSync 控制台</title>
  <link rel="icon" href="favicon.ico" type="image/x-icon">
  <link rel="stylesheet" href="assets/miuix.css">
  <link rel="stylesheet" href="assets/app.css">
</head>
<body>
  <noscript>
    <div class="boot-noscript">TQSync 控制台需要启用 JavaScript。</div>
  </noscript>

  <!-- 启动占位：JS 解析前立即显示，避免白屏 -->
  <div id="boot" class="boot" aria-hidden="true">
    <div class="boot-logo">
      <svg viewBox="0 0 48 48" width="56" height="56" fill="none" aria-hidden="true">
        <rect x="2" y="2" width="44" height="44" rx="14" fill="url(#bootGrad)"/>
        <path d="M15.5 24a8.5 8.5 0 0 1 14.6-5.9M32.5 24a8.5 8.5 0 0 1-14.6 5.9" stroke="#fff" stroke-width="2.6" stroke-linecap="round"/>
        <path d="M29.4 13.2v4.6h-4.6M18.6 34.8v-4.6h4.6" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
        <defs>
          <linearGradient id="bootGrad" x1="0" y1="0" x2="48" y2="48" gradientUnits="userSpaceOnUse">
            <stop stop-color="#4C93FF"/><stop offset="1" stop-color="#2C6FF0"/>
          </linearGradient>
        </defs>
      </svg>
    </div>
    <div class="boot-name">TQSync</div>
    <div class="boot-spinner" aria-label="正在加载"><span></span></div>
  </div>

  <!-- 登录页（由 app.js 填充） -->
  <div id="login-root" class="login-root" hidden></div>

  <!-- 主应用外壳（由 app.js 填充） -->
  <div id="app-root" class="app-root" hidden></div>

  <!-- 浮层容器：对话框、动作面板、提示条 -->
  <div id="overlay-root" class="overlay-root"></div>
  <div id="toast-root" class="toast-root" role="status" aria-live="polite"></div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
